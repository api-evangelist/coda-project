aid: coda-project
name: Coda Project
description: >-
  Coda Project, Inc. is the maker of Coda (now branded Superhuman Docs), an all-in-one
  collaborative workspace that blends the flexibility of a document, the structure of a
  spreadsheet, the power of applications, and the intelligence of AI into a single canvas.
  Founded in 2014 by Shishir Mehrotra and Alex DeNeui and used by tens of thousands of teams,
  Coda exposes a RESTful Docs API that lets developers list and search docs, create and copy
  docs, discover pages, tables, formulas, and controls, and read, insert, upsert, update, and
  delete rows. A separate Admin API provides programmatic organization administration —
  workspaces, users, groups, legal holds, audit events, webhooks, and Pack governance. Coda
  also ships a first-party Packs SDK and CLI for extending the platform, an official remote
  MCP server for AI clients, OAuth 2.0 with dynamic client registration, and a public Postman
  workspace.
