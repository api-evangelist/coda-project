        '
      operationId: getExportRequestStatus
      tags:
      - Doc Export
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/docId'
      - $ref: '#/components/parameters/exportId'
      responses:
        '200':
