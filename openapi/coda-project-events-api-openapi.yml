      description: Info about the entity or resource being acted upon.
      type: object
      required:
      - type
      - brainQuery
      additionalProperties: false
      properties:
        type:
          type: string
          description: Entity type.
          enum:
          - brainQuery
        brainQuery:
          $ref: '#/components/schemas/BrainQuery'
    EntityBillingAccount:
      x-schema-name: EntityBillingAccount
      description: Info about the entity or resource being acted upon.
      type: object
      required:
      - type
      - billingAccount
      additionalProperties: false
      properties:
        type:
          type: string
          description: Entity type.
          enum:
          - billingAccount
        billingAccount:
          $ref: '#/components/schemas/BillingAccount'
    ImportPreference:
      x-schema-name: ImportPreference
      description: An import preference for an external entity.
      type: object
      required:
      - type
      - id
      - externalEntity
      - preferenceType
      - createdAt
      - createdBy
      additionalProperties: false
      properties:
        type:
          type: string
          description: The type of this resource.
          enum:
          - importPreference
          x-tsType: Type.ImportPreference
        id:
          type: string
          format: uuid
          description: ID of the import preference.
          example: afe84ebf-4d06-44c5-b545-a8af5036bebf
        externalEntity:
          $ref: '#/components/schemas/ImportExternalEntity'
        preferenceType:
          type: string
          description: How the item should be treated on import.
          enum:
          - exempt
          - owner
          - location
          example: owner
        preferenceDetail:
          description: 'Settings for owner or location preferences. Omitted for exempt. On create and update, the equivalent fields are sent at the top level of the request body instead.

            '
          oneOf:
          - type: object
            required:
            - ownerEmail
            additionalProperties: false
            properties:
              ownerEmail:
                type: string
                format: email
                maxLength: 512
                description: Email of the user who will own imported documents for this item.
                example: owner@example.com
          - type: object
            required:
            - externalParent
            additionalProperties: false
            properties:
              externalParent:
                $ref: '#/components/schemas/ImportExternalParent'
        createdAt:
          type: string
          format: date-time
          description: When the preference was created, in ISO 8601 format.
          example: '2024-01-15T10:00:00.000Z'
        createdBy:
          type: number
          description: Coda user id that created the preference.
          example: 12345
        updatedAt:
          type: string
          format: date-time
          description: When the preference was last modified, in ISO 8601 format. Omitted if never updated.
          example: '2024-06-02T08:30:00.000Z'
        updatedBy:
          type: number
          description: Coda user id that last modified the preference. Omitted if never updated.
          example: 67890
    WebhookFilterPredicate:
      x-schema-name: WebhookFilterPredicate
      description: One entry in a webhook subscription filter.
      type: object
      required:
      - action
      additionalProperties: false
      properties:
        action:
          type: string
          description: The event action.
          example: EditDoc
    EntityPack:
      x-schema-name: EntityPack
      description: Info about the entity or resource being acted upon.
      type: object
      required:
      - type
      - pack
      additionalProperties: false
      properties:
        type:
          type: string
          description: Entity type.
          enum:
          - pack
        pack:
          $ref: '#/components/schemas/Pack'
    EntityWorkspace:
      x-schema-name: EntityWorkspace
      description: Info about the entity or resource being acted upon.
      type: object
      required:
      - type
      - workspace
      additionalProperties: false
      properties:
        type:
          type: string
          description: Entity type.
          enum:
          - workspace
        workspace:
          $ref: '#/components/schemas/Workspace'
    EntityLegalHold:
      x-schema-name: EntityLegalHold
      description: Info about the entity or resource being acted upon.
      type: object
      required:
      - type
      - legalHold
      additionalProperties: false
      properties:
        type:
          type: string
          description: Entity type.
          enum:
          - legalHold
        legalHold:
          $ref: '#/components/schemas/LegalHold'
    EntitySyncPage:
      x-schema-name: EntitySyncPage
      description: Info about the entity or resource being acted upon.
      type: object
      required:
      - type
      - syncPage
      additionalProperties: false
      properties:
        type:
          type: string
          description: Entity type.
          enum:
          - syncPage
        syncPage:
          $ref: '#/components/schemas/SyncPage'
    EntityExternalConnection:
      x-schema-name: EntityExternalConnection
      description: Info about the entity or resource being acted upon.
      type: object
      required:
      - type
      - externalConnection
      additionalProperties: false
      properties:
        type:
          type: string
          description: Entity type.
          enum:
          - externalConnection
        externalConnection:
          $ref: '#/components/schemas/ExternalConnection'
    WebhookFilter:
      x-schema-name: WebhookFilter
      description: Filter set for the webhook subscription.
      type: object
      additionalProperties: false
      properties:
        or:
          type: array
          items:
            $ref: '#/components/schemas/WebhookFilterPredicate'
    FolderType:
      x-schema-name: FolderType
      type: string
