- name: LegalHolds
  description: 'Legal holds are used to ensure a given set of docs cannot be deleted and enables simplified export management of doc content.

    '
paths:
  /organizations/{organizationId}/legalHolds:
    get:
      summary: List legal holds
      description: 'Returns a list of legal holds in the organization

        '
      operationId: listLegalHolds
      tags:
      - LegalHolds
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/limit'
      - $ref: '#/components/parameters/pageToken'
      - $ref: '#/components/parameters/query'
      responses:
        '200':
          description: List of legal holds.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LegalHoldList'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: 'import requests


          headers = {''Authorization'': ''Bearer <your API token>''}

          uri = ''https://docs.superhuman.com/apis/admin/v1/organizations/<your organization id>/legalHolds''

          res = requests.get(uri, headers=headers).json()


          print(f''First legal hold''s name is: {res["items"][0]["name"]}'')

          '
      - label: Shell
        lang: shell
        source: "curl -s -H 'Authorization: Bearer <your API token>' \\\n  'https://docs.superhuman.com/apis/admin/v1/organizations/<your organization id>/legalHolds' |\n  jq .items[0].name\n"
    post:
      summary: Create a new legal hold
      description: Creates a new legal hold in the Organization.
      operationId: addLegalHold
      tags:
      - LegalHolds
      parameters:
      - $ref: '#/components/parameters/organizationId'
      requestBody:
        description: Parameters for adding the new legal hold.
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddLegalHoldRequest'
      responses:
        '200':
          description: Confirmation that the hold was created.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AddLegalHoldResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: "import requests\n\nheaders = {'Authorization': 'Bearer <your API token>'}\nuri = f'https://docs.superhuman.com/apis/admin/v1/organizations/<your organization id>/legalHolds'\npayload = {\n  'name': 'Investigation Matter 123',\n  'description': 'Holding docs for legal matter 123',\n  'rangeStart': '2024-04-13T00:18:57.946Z',\n  'rangeEnd': '2024-04-13T00:18:57.946Z',\n  'userEmails': [\n    'joe@example.com',\n    'jane@example.com',\n  ]\n}\nres = requests.post(uri, headers=headers, json=payload)\n\n# => Create a new legal hold\n"
      - label: Shell
        lang: shell
        source: "curl -s -H 'Authorization: Bearer <your API token>' -X POST \\\n  'https://docs.superhuman.com/apis/admin/v1/organizations/<your organization id>/legalHolds' \\\n  -d '{\"name\": \"Investigation Matter 123\",\n    \"description\": \"Holding docs for legal matter 123\",\n    \"rangeStart\": \"2024-04-13T00:18:57.946Z\",\n    \"rangeEnd\": \"2024-04-13T00:18:57.946Z\",\n    \"userEmails\": [\n      \"joe@example.com\",\n      \"jane@example.com\",\n    ]}'\n# => Create a new legal hold\n"
