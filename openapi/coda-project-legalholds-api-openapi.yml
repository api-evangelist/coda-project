            schema:
              $ref: '#/components/schemas/UpdateLegalHoldRequest'
      responses:
        '200':
          description: The legal hold was updated.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UpdateLegalHoldResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: "import requests\n\nheaders = {'Authorization': 'Bearer <your API token>'}\nuri = 'https://docs.superhuman.com/apis/admin/v1/organizations/<your organization id>/leaglHolds/<your legal hold id>'\nbody = {\n  'description': 'An updated description string',\n}\nres = requests.put(uri, headers=headers, params=params, json=body).json()\n\nprint(f'Updated legal hold description')\n"
    delete:
      summary: Delete the legal hold
      description: Deletes an existing legal hold.
      operationId: deleteLegalHold
      tags:
      - LegalHolds
      parameters:
      - $ref: '#/components/parameters/organizationId'
      - $ref: '#/components/parameters/legalHoldId'
      responses:
        '200':
          description: Confirmation that the request was applied.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DeleteLegalHoldResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: 'import requests


          headers = {''Authorization'': ''Bearer <your API token>''}

          uri = f''https://docs.superhuman.com/apis/admin/v1/organizations/<your organization id>/legalHolds/<your legal hold id>''

          res = requests.delete(uri, headers=headers, json=payload)


          # => Delete the legal hold

          '
      - label: Shell
        lang: shell
        source: "curl -s -H 'Authorization: Bearer <your API token>' -X DELETE \\\n  'https://docs.superhuman.com/apis/admin/v1/organizations/<your organization id>/legalHolds/<your legal hold id>'\n# => Delete the legal hold\n"
