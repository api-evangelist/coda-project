          SuperhumanDocs.authenticate(''<your API token>'');


          // Delete all content

          var res = SuperhumanDocs.deletePageContent(''<doc ID>'', ''<page ID>'');

          Logger.log(''Deleted all content from page '' + res.id);

          // => Deleted all content from page <page ID>

          '
