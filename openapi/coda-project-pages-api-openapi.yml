    delete:
      summary: Delete page content
      description: Delete content from a page. You can delete specific elements by providing their IDs, or delete all content from the page.
      operationId: deletePageContent
      tags:
      - Pages
      parameters:
      - $ref: '#/components/parameters/docId_2'
      - $ref: '#/components/parameters/pageIdOrName'
      requestBody:
        description: Parameters for deleting page content.
        required: false
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PageContentDelete'
      responses:
        '202':
          description: A result indicating that the deletion was queued for processing.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PageContentDeleteResult'
        '400':
          $ref: '#/components/responses/BadRequestError'
        '401':
          $ref: '#/components/responses/UnauthorizedError'
        '403':
          $ref: '#/components/responses/ForbiddenError'
        '404':
          $ref: '#/components/responses/NotFoundError'
        '429':
          $ref: '#/components/responses/TooManyRequestsError'
      x-codeSamples:
      - label: Python 3.13
        lang: python
        source: 'import requests


          headers = {''Authorization'': ''Bearer <your API token>''}


          # Delete all content from the page

          uri = f''https://docs.superhuman.com/apis/v1/docs/<doc ID>/pages/<page ID>/content''

          req = requests.delete(uri, headers=headers)

          req.raise_for_status()

          res = req.json()

          print(f''Deleted all content from page {res["id"]}'')

          # => Deleted all content from page <page ID>


          # Delete specific elements

          payload = {''elementIds'': [''cl-abc123'', ''cl-def456'']}

          req = requests.delete(uri, headers=headers, json=payload)

          req.raise_for_status()

          res = req.json()

          print(f''Deleted {len(payload["elementIds"])} elements from page {res["id"]}'')

          # => Deleted 2 elements from page <page ID>

          '
      - label: Shell
        lang: shell
        source: "# Delete specific elements\ncurl -s -H 'Authorization: Bearer <your API token>' -X DELETE \\\n  -H \"Content-Type: application/json\" \\\n  -d '{\"elementIds\": [\"cl-abc123\", \"cl-def456\"]}' \\\n  'https://docs.superhuman.com/apis/v1/docs/<doc ID>/pages/<page ID>/content' |\n  jq '\"Deleted elements from page \" + .id'\n# => \"Deleted elements from page <page ID>\"\n"
      - label: Google Apps Script
        lang: javascript
        source: '// Import the SuperhumanDocs library via Resource->Libraries...:

