notes: >-
  Coda ships one first-party developer library — the Packs SDK (@codahq/packs-sdk), which
  also provides the `coda`/`packs` CLI for building and uploading Coda Packs. There is no
  first-party REST client SDK; the Docs API is called directly over HTTPS. A widely used
  community Python wrapper (codaio) is listed for completeness and marked official:false.
packages:
