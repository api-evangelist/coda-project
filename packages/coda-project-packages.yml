  registry: npm
  name: "@codahq/packs-sdk"
  url: https://www.npmjs.com/package/@codahq/packs-sdk
  install: npm install --save-dev @codahq/packs-sdk
  repository: https://github.com/coda/packs-sdk
  license: MIT
  official: true
  provides_cli: true
  cli_bins:
  - coda
  - packs
  description: >-
    Official SDK and CLI for building Coda Packs (extensions that add integrations, building
    blocks, and formulas to Coda docs). Ships the `coda`/`packs` command-line tool.
- language: python
  registry: pypi
  name: codaio
  url: https://pypi.org/project/codaio/
  install: pip install codaio
